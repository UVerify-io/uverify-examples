server {
  listen 3001;

  # Proxy API calls to yaci-store (works from both SSR and browser via host port mapping)
  location /api/ {
    proxy_pass http://yaci-store:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }

  # Proxy WebSocket to yaci-store with upgrade headers
  location /ws/ {
    proxy_pass http://yaci-store:8080/ws/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
  }

  # Everything else goes to the yaci-viewer Node.js SSR server (internal port 3000)
  location / {
    proxy_pass http://localhost:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
  }
}
