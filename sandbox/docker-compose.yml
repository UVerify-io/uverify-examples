services:

  # ── Local Cardano devnet (yano) ──────────────────────────────────────
  # Provides: Cardano block producer (N2N on 13337) + Blockfrost-compatible REST
  # API (port 8080) + devnet faucet + snapshot/restore endpoints.
  yano:
    build: ./yano
    image: uverify/sandbox-node:latest
    container_name: bloxbean-yano
    restart: unless-stopped
    ports:
      - "7070:7070"    # Blockfrost-compatible REST API + Swagger UI (/q/swagger-ui)
      - "13337:13337"  # Cardano N2N server (used by YACI Store in uverify-backend)
    volumes:
      - yaci_chainstate:/app/chainstate
      - yaci_genesis:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7070/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: uverify-sandbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uverify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sandbox_password}
      POSTGRES_DB: uverify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uverify"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── UVerify Backend ───────────────────────────────────────────────────────────
  # Mounts application-devnet.yml so the embedded YACI Store syncs from slot 0
  # against the local devnet node instead of preprod/mainnet.
  uverify-backend:
    image: uverify/uverify-backend:latest
    container_name: uverify-sandbox-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./application-devnet.yml:/app/application-devnet.yml
      - yaci_genesis:/app/genesis:ro
    depends_on:
      postgres:
        condition: service_healthy
      yano:
        condition: service_healthy
    environment:
      RATE_LIMIT_ENABLED: "false"
    ports:
      - "9090:9090"
      - "9091:9091"    # management (threaddump, metrics, loggers) — local only, not in prod
    deploy:
      resources:
        limits:
          cpus: '1.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ── YACI Store ───────────────────────────────────────────────────────────────
  # Full chain indexer that syncs from yano's N2N port and exposes a rich REST
  # API. Phoenix Explorer uses this instead of yano's minimal Blockfrost stub.
  yaci-store:
    image: bloxbean/yaci-store:2.0.0
    container_name: uverify-sandbox-yaci-store
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ledger-state
    volumes:
      - ./yaci-store/application.properties:/app/config/application.properties:ro
      - ./yaci-store/genesis:/app/genesis:ro
    depends_on:
      postgres:
        condition: service_healthy
      yano:
        condition: service_healthy
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          cpus: '1.5'
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/blocks/latest || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Yaci Viewer ──────────────────────────────────────────────────────────────
  # Cardano block explorer for YACI Store.
  # Access at http://localhost:3001
  yaci-viewer:
    build: ./yaci-viewer
    container_name: uverify-sandbox-yaci-viewer
    restart: unless-stopped
    depends_on:
      yaci-store:
        condition: service_healthy
    ports:
      - "3001:3001"

  # ── UVerify UI ────────────────────────────────────────────────────────────────
  # Uses the builder image which compiles the Vite app at container startup so
  # that custom templates mounted into /app/src/templates are included in the build.
  uverify-ui:
    image: uverify/uverify-ui:builder
    container_name: uverify-sandbox-ui
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://localhost:9090
      VITE_CARDANO_NETWORK: preprod
    volumes:
      - ./custom-ui-templates:/app/custom-templates
      - ./custom-ui-templates/additional-templates.json:/app/additional-templates.json:ro
    depends_on:
      uverify-backend:
        condition: service_healthy
    ports:
      - "3000:80"

  # ── KERIA infrastructure (opt-in profile) ────────────────────────────────────
  # Start with: python3 sandbox.py start --keria
  # Provides: KERI witness network, vLEI credential schema server,
  #           KERIA cloud agent, and vLEI Verifier for credential status queries.

  witness-demo:
    image: weboftrust/keri-witness-demo:1.1.0
    container_name: uverify-sandbox-witness-demo
    restart: unless-stopped
    profiles: [keria]
    volumes:
      - ./keria/config/witness-demo:/keripy/scripts/keri/cf/main
    ports:
      - "5642:5642"
      - "5643:5643"
      - "5644:5644"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:5642/oobi || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  vlei-server:
    image: gleif/vlei:0.2.0
    container_name: uverify-sandbox-vlei-server
    restart: unless-stopped
    profiles: [keria]
    command: vLEI-server -s ./schema/acdc -c ./samples/acdc/ -o ./samples/oobis/
    ports:
      - "7723:7723"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7723/oobi/EBfdlu8R27Fbx-ehrqwImnK-8Cm79sqbAQ4MmvEAYqao || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 10
      start_period: 5s

  keria:
    image: weboftrust/keria:0.2.0-rc2
    container_name: uverify-sandbox-keria
    restart: unless-stopped
    profiles: [keria]
    depends_on:
      witness-demo:
        condition: service_healthy
      vlei-server:
        condition: service_healthy
    volumes:
      - ./keria/config/keria.json:/keria/config/keri/cf/keria.json
    command: start --config-dir /keria/config --config-file keria --name agent
    environment:
      KERI_AGENT_CORS: "1"
      PYTHONUNBUFFERED: "1"
      PYTHONIOENCODING: UTF-8
    ports:
      - "3901:3901"   # Admin API (Signify clients connect here)
      - "3902:3902"   # Message router / OOBI endpoint
      - "3903:3903"   # Boot / agency
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3902/spec.yaml || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

  vlei-verifier:
    image: gleif/vlei-verifier:latest
    container_name: uverify-sandbox-vlei-verifier
    restart: unless-stopped
    profiles: [keria]
    depends_on:
      keria:
        condition: service_healthy
    environment:
      VERIFIER_CONFIG_FILE: verifier-config-public.json
      # False lets locally issued ACDCs pass without tracing back to the GLEIF root
      VERIFY_ROOT_OF_TRUST: "False"
    ports:
      - "7676:7676"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7676/health || exit 1"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 10s

volumes:
  yaci_chainstate:
    external: true
    name: sandbox_yaci_chainstate
  yaci_genesis:
  postgres_data:
