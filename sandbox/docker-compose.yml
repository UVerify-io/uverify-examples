services:

  # ── Local Cardano devnet (yano) ──────────────────────────────────────
  # Provides: Cardano block producer (N2N on 13337) + Blockfrost-compatible REST
  # API (port 8080) + devnet faucet + snapshot/restore endpoints.
  yano:
    build: ./yano
    image: uverify/sandbox-node:latest
    container_name: bloxbean-yano
    restart: unless-stopped
    depends_on:
      seed-chainstate:
        condition: service_completed_successfully
    ports:
      - "7070:7070"    # Blockfrost-compatible REST API + Swagger UI (/q/swagger-ui)
      - "13337:13337"  # Cardano N2N server (used by YACI Store in uverify-backend)
    volumes:
      - yaci_chainstate:/app/chainstate
      - yaci_genesis:/app/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7070/q/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # ── Chainstate seeder (one-shot) ─────────────────────────────────────────────
  # Copies the uverify-base-state snapshot files into the yaci_chainstate volume
  # BEFORE yano starts. This ensures yano boots from the known good chain state
  # rather than producing a fresh genesis block on an empty volume.
  # Only copies if the chainstate is empty (CURRENT file absent).
  seed-chainstate:
    image: uverify/sandbox-node:latest
    container_name: uverify-sandbox-seed-chainstate
    restart: no
    volumes:
      - yaci_chainstate:/chainstate
    command: >
      sh -c "
        if [ ! -f /chainstate/CURRENT ]; then
          echo 'Seeding chainstate from snapshot...';
          cp -a /app/snapshots/uverify-base-state/checkpoint/. /chainstate/;
          echo 'Done.';
        else
          echo 'Chainstate already populated, skipping seed.';
        fi
      "

  # ── PostgreSQL ────────────────────────────────────────────────────────────────
  postgres:
    image: postgres:15
    container_name: uverify-sandbox-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: uverify
      POSTGRES_PASSWORD: ${DB_PASSWORD:-sandbox_password}
      POSTGRES_DB: uverify
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U uverify"]
      interval: 5s
      timeout: 3s
      retries: 15

  # ── UVerify Backend ───────────────────────────────────────────────────────────
  # Mounts application-devnet.yml so the embedded YACI Store syncs from slot 0
  # against the local devnet node instead of preprod/mainnet.
  uverify-backend:
    image: uverify/uverify-backend:latest
    container_name: uverify-sandbox-backend
    restart: unless-stopped
    env_file: .env
    volumes:
      - ./application-devnet.yml:/app/application-devnet.yml
      - yaci_genesis:/app/genesis:ro
    depends_on:
      postgres:
        condition: service_healthy
      yano:
        condition: service_healthy
    ports:
      - "9090:9090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9090/actuator/health | grep -q UP || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 45s

  # ── YACI Store ───────────────────────────────────────────────────────────────
  # Full chain indexer that syncs from yano's N2N port and exposes a rich REST
  # API. Phoenix Explorer uses this instead of yano's minimal Blockfrost stub.
  yaci-store:
    image: bloxbean/yaci-store:2.0.0
    container_name: uverify-sandbox-yaci-store
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: ledger-state
    volumes:
      - ./yaci-store/application.properties:/app/config/application.properties:ro
      - ./yaci-store/genesis:/app/genesis:ro
    depends_on:
      postgres:
        condition: service_healthy
      yano:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/v1/blocks/latest || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ── Yaci Viewer ──────────────────────────────────────────────────────────────
  # Cardano block explorer for YACI Store.
  # Access at http://localhost:3001
  yaci-viewer:
    build: ./yaci-viewer
    container_name: uverify-sandbox-yaci-viewer
    restart: unless-stopped
    depends_on:
      yaci-store:
        condition: service_healthy
    ports:
      - "3001:3001"

  # ── UVerify UI ────────────────────────────────────────────────────────────────
  uverify-ui:
    image: uverify/uverify-ui:latest
    container_name: uverify-sandbox-ui
    restart: unless-stopped
    environment:
      VITE_BACKEND_URL: http://localhost:9090
      VITE_CARDANO_NETWORK: preprod
    depends_on:
      uverify-backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  yaci_chainstate:
  yaci_genesis:
  postgres_data:
