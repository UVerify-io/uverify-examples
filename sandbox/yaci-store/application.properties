# ── Database ──────────────────────────────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://postgres:5432/yaci_store?currentSchema=yaci_store
spring.datasource.username=yaci
spring.datasource.password=dbpass

# ── Cardano node (yano devnet via N2N) ────────────────────────────────────────
store.cardano.host=yano
store.cardano.port=13337
store.cardano.protocol-magic=42

# ── Genesis files (from the shared yaci_genesis volume, mounted at /app/genesis)
# Required when connecting to a devnet — yaci-store cannot auto-fetch these.
store.cardano.byron-genesis-file=/app/genesis/byron-genesis.json
store.cardano.shelley-genesis-file=/app/genesis/shelley-genesis.json
store.cardano.alonzo-genesis-file=/app/genesis/alonzo-genesis.json
store.cardano.conway-genesis-file=/app/genesis/conway-genesis.json

# ── Live WebSocket (/ws/liveblocks) ──────────────────────────────────────────
store.live.enabled=true

# ── Sync from genesis ─────────────────────────────────────────────────────────
store.cardano.sync-start-slot=0

# ── Server ────────────────────────────────────────────────────────────────────
server.forward-headers-strategy=framework
